<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Agent Up</title>
<style>
/* Theme is driven only by data-theme, never by the OS setting. */
html[data-theme="light"]{color-scheme:light;
  --bg:#eaeef1;--text:#084059;--muted:#3d6478;--panel:#ffffff;--line:#ced8de;--accent:#18a5a7;
  --link:#084059;--cta-bg:#084059;--cta-text:#bfffc7;--sec-bg:#ffffff;--sec-text:#084059;--sec-line:#084059;
  --focus:#704dff;--deco:#704dff;--code-bg:#f4f7f9;--seg-up:#ced8de;--seg-up-line:#6d8797;--tab-line:#084059;
  --tint-mix:#ffffff;--bad:#fd5e42;--good:#18a5a7}
html[data-theme="light"] body{background:#eaeef1;color:#084059}
html[data-theme="dark"]{color-scheme:dark;
  --bg:#172736;--text:#eaeef1;--muted:#b9c7d0;--panel:#084059;--line:#18a5a7;--accent:#18a5a7;
  --link:#bfffc7;--cta-bg:#bfffc7;--cta-text:#084059;--sec-bg:transparent;--sec-text:#eaeef1;--sec-line:#eaeef1;
  --focus:#bfffc7;--deco:#bfffc7;--code-bg:#10202d;--seg-up:#3b5566;--seg-up-line:#8aa3b2;--tab-line:#bfffc7;
  --tint-mix:#172736;--bad:#fd5e42;--good:#18a5a7}
html[data-theme="dark"] body{background:#172736;color:#eaeef1}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;overflow:hidden;font-family:'Montserrat','Segoe UI',Arial,sans-serif;font-weight:400;font-size:14px;line-height:1.4}
p,li,td,th,dd,dt,label,.body{line-height:1.4;font-size:14px}
h1,h2,h3{font-family:'Montserrat','Segoe UI',Arial,sans-serif;font-weight:600;line-height:1.25;letter-spacing:-0.03em;margin:0}
h1{font-size:20px}h2{font-size:18px;margin-bottom:12px}h3{font-size:15px;margin:16px 0 8px}
a{color:var(--link);text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:2px}
strong{font-weight:600}
code{font-family:'Azeret Mono',ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--code-bg);padding:1px 4px;border-radius:4px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button,input,textarea{font-family:inherit;font-size:14px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Three flex children: header, scroll, footer */
.app-header{flex:0 0 auto;padding:12px 16px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.app-scroll{flex:1 1 auto;overflow-y:auto;padding:24px 16px 32px}
.footer-nav{flex:0 0 auto;display:flex;gap:12px;justify-content:space-between;align-items:stretch;padding:10px 16px;border-top:1px solid var(--line);background:var(--bg)}
.wrap{max-width:760px;margin:0 auto}

.brandrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{height:28px;width:auto;display:block}
html[data-theme="light"] .logo-dark{display:none}
html[data-theme="dark"] .logo-light{display:none}
.wordmark{font-weight:600;letter-spacing:-0.03em;font-size:16px;padding-left:12px;border-left:1px solid var(--line)}
.mission-title{margin:10px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.model{margin:2px 0 8px;color:var(--muted);font-size:13px;font-weight:600}
.stepline{font-weight:600;margin:4px 0 2px}
.track{display:flex;gap:4px;margin-top:6px}
.seg{flex:1;height:6px;border-radius:3px;background:var(--seg-up);box-shadow:inset 0 0 0 1px var(--seg-up-line)}
.seg.done{background:#18a5a7;box-shadow:none}
.seg.now{background:#ffc819;box-shadow:inset 0 0 0 1px #b88a00}

/* Buttons: brand CTA pills, all the same height */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;border-radius:999px;font-weight:600;cursor:pointer;text-decoration:none;box-sizing:border-box;border:2px solid transparent;line-height:1.2;text-align:center}
.btn-primary{background:var(--cta-bg);color:var(--cta-text);border-color:var(--cta-bg)}
.btn-secondary{background:var(--sec-bg);color:var(--sec-text);border-color:var(--sec-line)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn-small{min-height:36px;padding:0 16px;font-size:13px}
.footer-nav .btn{flex:0 1 auto}
.footer-nav #next{margin-left:auto}

/* Pills (Azeret Mono labels) */
.pill{display:inline-block;font-family:'Azeret Mono',ui-monospace,Menlo,Consolas,monospace;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:2px solid var(--pc);background:color-mix(in srgb,var(--pc) 22%,var(--tint-mix));color:var(--text);margin:0 0 6px}
.pc-blue{--pc:#3f89e4}.pc-green{--pc:#18a5a7}.pc-lilac{--pc:#bd86f8}.pc-yellow{--pc:#ffc819}.pc-orange{--pc:#ef9336}.pc-red{--pc:#fd5e42}.pc-bloom{--pc:#46add5}.pc-indigo{--pc:#704dff}
.part{margin:0 0 18px}
.part p{margin:4px 0 8px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:12px 0}
.callout{border-left:4px solid var(--cc);padding:8px 12px;margin:12px 0;background:color-mix(in srgb,var(--cc) 10%,transparent);border-radius:0 6px 6px 0}
.callout .ctag{display:block;font-family:'Azeret Mono',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.c-def{--cc:#18a5a7}.c-ex{--cc:#3f89e4}.c-warn{--cc:#ef9336}.c-q{--cc:#bd86f8}.c-take{--cc:#704dff}
html[data-theme="dark"] .c-take{--cc:#bfffc7}
.term{font-weight:600;color:var(--text);text-decoration:none}
.term::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--deco);margin-left:3px;vertical-align:super}
.term:hover{text-decoration:underline}

/* Concept visuals */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}
.cards .card{margin:0;border-top:4px solid var(--pc,#18a5a7)}
.flow{display:flex;flex-wrap:wrap;gap:22px;margin:12px 0}
.flow .card{margin:0;flex:1 1 140px;position:relative}
.flow .card:not(:last-child)::after{content:"";position:absolute;right:-18px;top:50%;width:14px;height:2px;background:var(--accent)}
table.vt{border-collapse:collapse;width:100%;margin:12px 0}
table.vt th,table.vt td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.vt th{background:var(--code-bg)}

/* BAD / GOOD */
.toggle{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.toggle .btn[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:1px}
.ex-card{border:2px solid var(--pc);border-radius:8px;padding:12px 14px;margin:10px 0;background:var(--panel)}
details.why{margin:8px 0}details.why summary{cursor:pointer;font-weight:600}details.scen summary{cursor:pointer;font-weight:600}
.howto{margin-top:14px;border-left:4px solid var(--accent)}.qcheck .opts{list-style:none;padding-left:0}.qcheck .opts li{margin:6px 0}.qcheck .opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}.qcheck .opt:hover:not(:disabled){border-color:var(--accent)}.qcheck .opt.ok{border:2px solid var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}.qcheck .opt.no{border:2px solid var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}.qcheck .opt:disabled{cursor:default;opacity:1}.qcheck .fb{margin:10px 0 0;padding:8px 12px;border-left:4px solid var(--line);border-radius:0 6px 6px 0}.qcheck .fb.ok{border-left-color:var(--good)}.qcheck .fb.no{border-left-color:var(--bad)}
.ex-card pre,.preview pre,pre.tpl{white-space:pre-wrap;word-break:break-word;font-family:'Azeret Mono',ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.45;margin:6px 0 0;background:var(--code-bg);padding:10px;border-radius:6px}
.hint{color:var(--muted);font-style:normal}

/* Question hand-off */
.qbox{border-left:4px solid #bd86f8;padding:10px 12px;margin:16px 0;background:color-mix(in srgb,#bd86f8 10%,transparent);border-radius:0 6px 6px 0}
.qbox .qtext{font-weight:600;margin:2px 0 8px}
.qnote{font-size:12px;color:var(--muted);margin:6px 0 0}
.status{font-size:13px;font-weight:500}

/* Checklists */
.checklist{list-style:none;padding:0;margin:8px 0}
.checklist li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.checklist li:last-child{border-bottom:none}
.checklist input{flex-shrink:0;width:18px;height:18px;margin:1px 0 0;accent-color:#18a5a7}
.checklist label{flex:1}


/* Closure */
.achieve{background:#bfffc7;color:#084059;font-weight:400;font-size:14px;border-radius:8px;padding:12px 16px;margin:0 0 12px}
.achieve .sum-title{font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.achieve ul{margin:0;padding-left:18px}
.achieve strong{font-weight:700}
.achieve li{margin:2px 0}
.closure-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.closure-actions .btn{flex:1 1 200px}

details.more{margin:12px 0}
details.more summary{list-style:none;cursor:pointer;font-weight:600;color:var(--link);text-decoration:underline;text-decoration-color:var(--accent)}
details.more summary::-webkit-details-marker{display:none}
details.more[open] .lbl-more,details.more:not([open]) .lbl-less{display:none}
.notice{font-size:12px;background:color-mix(in srgb,#ffc819 25%,var(--tint-mix));border:1px solid #b88a00;border-radius:6px;padding:6px 10px;margin:0 0 12px}
.gl dt{font-weight:600;margin-top:10px}.gl dd{margin:2px 0 0}
.src li{margin:0 0 12px}
/* Permanent right-side tabs: dark mode, glossary, sources (from v3) */
.floating-side-bar{position:fixed;right:0;top:24px;z-index:100;display:flex;flex-direction:column;align-items:stretch;gap:10px}
.side-tab-btn{display:flex;align-items:center;justify-content:flex-start;min-width:140px;box-sizing:border-box;gap:8px;padding:9px 18px 9px 14px;background:#ffffff;color:#084059;border:1px solid #ced8de;border-right:0;border-radius:20px 0 0 20px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:-2px 2px 6px rgba(8,64,89,.08);transition:transform .2s cubic-bezier(.4,0,.2,1),background-color .2s ease}
.side-tab-btn:hover{transform:translateX(-4px);background:#eaeef1}
.side-tab-btn svg{width:18px;height:18px;fill:none;stroke:#18a5a7;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
html[data-theme="dark"] .side-tab-btn{background:#0e1c28;color:#eaeef1;border-color:#3b5566;box-shadow:none}
html[data-theme="dark"] .side-tab-btn:hover{background:#084059}


/* Slide-out drawer */
.ref-drawer{position:fixed;top:0;right:-100%;width:85%;max-width:400px;height:100%;background:#ffffff;box-shadow:-4px 0 20px rgba(0,0,0,.2);z-index:110;transition:right .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;padding:24px;box-sizing:border-box;visibility:hidden}
html[data-theme="dark"] .ref-drawer{background:#172736;border-left:1px solid #18a5a7}
.ref-drawer.is-open{right:0;visibility:visible}
.drawer-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
.drawer-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text);transition:transform .2s ease}
.drawer-close:hover{transform:scale(1.2)}
.drawer-content{flex:1;overflow-y:auto}
@media (prefers-reduced-motion:reduce){.side-tab-btn,.ref-drawer,.chevron-icon{transition:none}}
/* Only the fixed header needs to clear the side tabs */
@media (max-width:1100px){.app-header{padding-right:150px}}
@media (max-width:820px){.side-tab-btn span{display:none}.side-tab-btn{padding:10px 12px;min-width:0}.app-header{padding-right:60px}}
/* Trustworthy AI Check: law labels as coloured pills, text without boxes */
.law{margin:16px 0 18px}
.law .pill{margin:0 0 6px}
.law .lead{font-weight:600;margin:0 0 2px}
.law p{margin:0 0 6px}
/* One side tab = one panel: the tab stays attached to the open panel and closes it again */
.floating-side-bar{z-index:120;transition:right .3s cubic-bezier(.4,0,.2,1)}
.floating-side-bar.drawer-open{right:min(85vw,400px)}
.side-tab-btn[aria-expanded="true"]{background:#084059;color:#ffffff;border-color:#084059}
.side-tab-btn[aria-expanded="true"] svg{stroke:#ffffff}
html[data-theme="dark"] .side-tab-btn[aria-expanded="true"]{background:#eaeef1;color:#084059;border-color:#eaeef1}
html[data-theme="dark"] .side-tab-btn[aria-expanded="true"] svg{stroke:#084059}
.drawer-heading{margin:0;font-size:20px}
@media (prefers-reduced-motion:reduce){.floating-side-bar{transition:none}}
/* Rules card (like Other ways) */
.laws-card .law{margin:0;padding:14px 0;border-top:1px solid var(--line)}
.laws-card .law:first-child{border-top:0;padding-top:2px}
.laws-card .law:last-child{padding-bottom:0}
/* Build layers, live prompt, template */
.prow-actions{display:flex;gap:10px;align-items:center;margin-top:8px}
.src .org{font-weight:600}
.tpl-how ul{margin:6px 0 0}
.th{font-weight:700;margin:6px 0 4px}
.tl{border:1px solid rgba(120,140,155,.5);border-radius:10px;padding:5px 12px;margin:6px 0}.tl summary{cursor:pointer;font-weight:600}.tl p{margin:6px 0 2px}
.tc{list-style:none;padding:0;margin:0 0 10px}.tc li{margin:6px 0}.tc label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}.tc input{margin-top:4px}


/* ===== Website look (appliedai-institute.de): white page, top nav, dark hero band, eyebrow labels ===== */

body,p,li,td,th,dd,dt,label,.body{font-size:15px;font-weight:500;line-height:1.42}

.side-tab-btn span,.side-tab-btn[aria-expanded="true"] span{display:inline!important}
.hero{background:#172736;color:#ffffff;padding:14px 16px 12px}
.hero .wrap{padding:0}

<body>
<header class="app-header">
