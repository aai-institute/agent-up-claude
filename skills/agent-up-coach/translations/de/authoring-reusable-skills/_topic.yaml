title: Wiederverwendbare Skills erstellen
description: Mach aus einer wiederkehrenden Aufgabe einen Skill, den deine KI jedes Mal gleich ausführt. Du schreibst und testest ihn, gibst ihm Struktur, verbindest ihn mit einer App und machst ihn teilbar.
level_question: "Was passt am ehesten zu dir? A: Ich habe noch nie von Skills gehört. B: Ich nutze Skills, die andere erstellt haben. C: Ich habe einen Skill geschrieben, aber nicht getestet. D: Ich baue und teste Skills, auch mit Dateien oder Skripten."
level_map: "A: guided, B: guided, C: standard, D: fast-track"
